name: Worker perspective
description: Identify a worker interest, risk, protection, or remedy the draft misses.
title: "[Worker perspective]: "
labels:
  - worker-perspective
body:
  - type: markdown
    attributes:
      value: >-
        You may use a synthetic or generalized scenario. Do not
        identify an individual or disclose protected source material.
        Participation records a perspective; it does not imply endorsement.
  - type: textarea
    id: situation
    attributes:
      label: Situation
      description: What might happen to a worker or their capability claim under this draft?
    validations:
      required: true
  - type: textarea
    id: missing_protection
    attributes:
      label: Missing or unsafe protection
    validations:
      required: true
  - type: textarea
    id: remedy
    attributes:
      label: What would meaningful review or remedy require?
      description: Distinguish review, appeal, and remedy where relevant.
    validations:
      required: true
  - type: textarea
    id: power
    attributes:
      label: Power or participation concern
      description: Who may be unable to participate freely or challenge a decision?
