name: Related work
description: Add a standard, project, law, paper, or governance model that changes the analysis.
title: "[Related work]: "
labels:
  - related-work
body:
  - type: markdown
    attributes:
      value: >-
        Describe the source accurately and distinguish its requirements from
        this project's proposals. Participation does not imply endorsement.
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Public URL
    validations:
      required: true
  - type: textarea
    id: contribution
    attributes:
      label: What does it already solve?
    validations:
      required: true
  - type: textarea
    id: consequence
    attributes:
      label: Consequence for this project
      description: Should the charter reuse it, narrow its scope, stop, or investigate further?
    validations:
      required: true
