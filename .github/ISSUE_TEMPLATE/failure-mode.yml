name: Failure mode
description: Show how the charter or ecosystem could fail, be abused, or create harm.
title: "[Failure mode]: "
labels:
  - critique
body:
  - type: markdown
    attributes:
      value: >-
        Do not include protected source material or personal data.
        Participation records a perspective; it does not imply endorsement.
  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: Describe the actors, decision, and failure using synthetic or generalized facts.
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Who is affected and how?
    validations:
      required: true
  - type: textarea
    id: governed_objects
    attributes:
      label: Governed objects, dispositions, and statuses
      description: >-
        Identify each capability claim, evidence item, or artifact separately.
        Use a charter disposition for each object, and keep its attestation,
        verification, authorization, and review status separate.
    validations:
      required: true
  - type: textarea
    id: charter_gap
    attributes:
      label: Charter gap
      description: Which protection, procedural safeguard, authorization, assurance, incentive, or governance boundary fails?
    validations:
      required: true
  - type: dropdown
    id: recommendation
    attributes:
      label: Recommended project direction
      options:
        - Continue with a charter change
        - Narrow the scope
        - Stop the effort
        - Investigate further
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public evidence or related work
      description: Add public links that others can inspect. Do not attach protected source material.
