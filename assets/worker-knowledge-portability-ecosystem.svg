<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1720" viewBox="0 0 1600 1720" role="img" aria-labelledby="title desc">
  <title id="title">Worker Knowledge Portability Ecosystem</title>
  <desc id="desc">An ecosystem architecture connecting stakeholders, Charter principles, an open protocol, potential implementations, an assurance and governance ecosystem, and four governed claim and evidence dispositions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52606d"/>
    </marker>
    <style>
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .subtitle { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #486581; }
      .section { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .section[font-size="15"] { font-size: 15px; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .label[font-size="17"] { font-size: 17px; }
      .label[font-size="16"] { font-size: 16px; }
      .label[font-size="15"] { font-size: 15px; }
      .label[font-size="14"] { font-size: 14px; }
      .small { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334e68; }
      .small[font-size="14"] { font-size: 14px; }
      .tiny { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #627d98; }
      .line { stroke: #52606d; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .feedback { stroke: #7b8794; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
      .group { fill: #f8fafc; stroke: #bcccdc; stroke-width: 2; rx: 22; }
      .stakeholder { fill: #e6f6ff; stroke: #62b0e8; stroke-width: 2; rx: 16; }
      .principle { fill: #fff8e6; stroke: #e0a82e; stroke-width: 2; rx: 14; }
      .protocol { fill: #eefcf5; stroke: #48a779; stroke-width: 2; rx: 14; }
      .implementation { fill: #f2efff; stroke: #8b72d8; stroke-width: 2; rx: 14; }
      .assurance { fill: #fff0f3; stroke: #d66a83; stroke-width: 2; rx: 14; }
      .output { fill: #ffffff; stroke: #52606d; stroke-width: 2.5; rx: 16; }
      .core { fill: #173f5f; stroke: #173f5f; stroke-width: 2; rx: 18; }
      .coretext { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .coretiny { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #d9e8f5; }
      .coretiny[font-size="13"] { font-size: 13px; }
    </style>
  </defs>

  <rect width="1600" height="1720" fill="#ffffff"/>

  <text x="800" y="58" text-anchor="middle" class="title">Worker Knowledge Portability Ecosystem</text>
  <text x="800" y="92" text-anchor="middle" class="subtitle">Open rules, multiple potential implementations, independent assurance, and governed claim and evidence dispositions</text>

  <!-- Stakeholders -->
  <rect x="70" y="130" width="1460" height="180" class="group"/>
  <text x="100" y="170" class="section">Stakeholders</text>

  <rect x="100" y="195" width="250" height="82" class="stakeholder"/>
  <text x="225" y="229" text-anchor="middle" class="label">Workers</text>
  <text x="225" y="253" text-anchor="middle" class="small">portable capability claims</text>

  <rect x="390" y="195" width="250" height="82" class="stakeholder"/>
  <text x="515" y="229" text-anchor="middle" class="label" font-size="17">Originating organizations</text>
  <text x="515" y="253" text-anchor="middle" class="small">protected evidence custody</text>

  <rect x="680" y="195" width="250" height="82" class="stakeholder"/>
  <text x="805" y="229" text-anchor="middle" class="label" font-size="17">AI providers and operators</text>
  <text x="805" y="253" text-anchor="middle" class="small">interoperability</text>

  <rect x="970" y="195" width="250" height="82" class="stakeholder"/>
  <text x="1095" y="225" text-anchor="middle" class="label" font-size="17">Worker representative bodies</text>
  <text x="1095" y="250" text-anchor="middle" class="small">collective governance</text>

  <rect x="1260" y="195" width="240" height="82" class="stakeholder"/>
  <text x="1380" y="225" text-anchor="middle" class="label" font-size="16">Independent oversight bodies</text>
  <text x="1380" y="250" text-anchor="middle" class="small">review and remedy</text>

  <!-- Constitution -->
  <path d="M800 310 L800 350" class="line"/>
  <rect x="70" y="360" width="1460" height="218" class="group"/>
  <text x="100" y="400" class="section">1 · Worker Knowledge Portability Charter</text>

  <rect x="100" y="430" width="315" height="100" class="principle"/>
  <text x="257" y="468" text-anchor="middle" class="label">Worker capability agency</text>
  <text x="257" y="495" text-anchor="middle" class="small">transparency · recognition · mobility</text>

  <rect x="455" y="430" width="315" height="100" class="principle"/>
  <text x="612" y="468" text-anchor="middle" class="label" font-size="16">Protected organizational information</text>
  <text x="612" y="495" text-anchor="middle" class="small">secrecy · work product · evidence</text>

  <rect x="810" y="430" width="315" height="100" class="principle"/>
  <text x="967" y="468" text-anchor="middle" class="label">Claim–evidence separation</text>
  <text x="967" y="495" text-anchor="middle" class="small">no blanket ownership · no extraction</text>

  <rect x="1165" y="430" width="335" height="100" class="principle"/>
  <text x="1332" y="468" text-anchor="middle" class="label">Review, appeal, and remedy</text>
  <text x="1332" y="495" text-anchor="middle" class="small" font-size="14">procedural safeguards · evidence · no retaliation</text>

  <!-- Protocol -->
  <path d="M800 578 L800 618" class="line"/>
  <rect x="70" y="628" width="1460" height="280" class="group"/>
  <text x="100" y="668" class="section">2 · Open protocol</text>

  <rect x="100" y="700" width="430" height="80" class="protocol"/>
  <text x="315" y="734" text-anchor="middle" class="label">Governed capability-claim schema</text>
  <text x="315" y="759" text-anchor="middle" class="small">portable claims—not replayable memory</text>

  <rect x="585" y="700" width="430" height="80" class="protocol"/>
  <text x="800" y="734" text-anchor="middle" class="label">Claim-level provenance</text>
  <text x="800" y="759" text-anchor="middle" class="small">source · author · derivation · evidence</text>

  <rect x="1070" y="700" width="430" height="80" class="protocol"/>
  <text x="1285" y="725" text-anchor="middle" class="label" font-size="16">Restrictions, permissions,</text>
  <text x="1285" y="746" text-anchor="middle" class="label" font-size="16">and claim-attestation status</text>
  <text x="1285" y="770" text-anchor="middle" class="small">access · use · authorization · review</text>

  <rect x="100" y="805" width="430" height="80" class="protocol"/>
  <text x="315" y="831" text-anchor="middle" class="label" font-size="15">Disclosure-minimizing abstraction</text>
  <text x="315" y="852" text-anchor="middle" class="label" font-size="15">requirements</text>
  <text x="315" y="873" text-anchor="middle" class="small" font-size="14">reduce protected-source disclosure risk</text>

  <rect x="585" y="805" width="430" height="80" class="protocol"/>
  <text x="800" y="823" text-anchor="middle" class="label" font-size="14">Separate claim, claim-attestation, authorization,</text>
  <text x="800" y="843" text-anchor="middle" class="label" font-size="14">and evidence lifecycles</text>
  <text x="800" y="870" text-anchor="middle" class="small" font-size="14">claim · claim attestation · authorization · evidence</text>

  <rect x="1070" y="805" width="430" height="80" class="protocol"/>
  <text x="1285" y="839" text-anchor="middle" class="label">Review, dispute, and decision records</text>
  <text x="1285" y="864" text-anchor="middle" class="small">decisions remain inspectable</text>

  <!-- Two ecosystem branches -->
  <path d="M800 908 L800 944 L405 944 L405 980" class="line"/>
  <path d="M800 908 L800 944 L1195 944 L1195 980" class="line"/>

  <rect x="70" y="990" width="670" height="330" class="group"/>
  <text x="100" y="1030" class="section" font-size="15">3 · Potential implementations, until a normative protocol exists</text>

  <rect x="100" y="1060" width="285" height="80" class="implementation"/>
  <text x="242" y="1094" text-anchor="middle" class="label" font-size="16">Worker-controlled claim repository</text>
  <text x="242" y="1119" text-anchor="middle" class="small">portable claim custody</text>

  <rect x="425" y="1060" width="285" height="80" class="implementation"/>
  <text x="567" y="1094" text-anchor="middle" class="label" font-size="15">Protected source evidence repository</text>
  <text x="567" y="1119" text-anchor="middle" class="small">protected evidence custody</text>

  <rect x="100" y="1165" width="285" height="80" class="implementation"/>
  <text x="242" y="1199" text-anchor="middle" class="label" font-size="14">Abstraction and disclosure-risk services</text>
  <text x="242" y="1224" text-anchor="middle" class="small">propose · abstract · explain</text>

  <rect x="425" y="1165" width="285" height="80" class="implementation"/>
  <text x="567" y="1190" text-anchor="middle" class="label" font-size="13">AI memory and agent runtime</text>
  <text x="567" y="1211" text-anchor="middle" class="label" font-size="13">adapters</text>
  <text x="567" y="1230" text-anchor="middle" class="small" font-size="12">AI · HR · knowledge · identity systems</text>

  <rect x="262" y="1260" width="285" height="42" class="implementation"/>
  <text x="404" y="1287" text-anchor="middle" class="small">Offboarding and review systems</text>

  <rect x="860" y="990" width="670" height="330" class="group"/>
  <text x="890" y="1030" class="section">4 · Assurance and governance ecosystem</text>

  <rect x="890" y="1060" width="285" height="80" class="assurance"/>
  <text x="1032" y="1094" text-anchor="middle" class="label">Conformance tests</text>
  <text x="1032" y="1119" text-anchor="middle" class="small">test process and safeguards</text>

  <rect x="1215" y="1060" width="285" height="80" class="assurance"/>
  <text x="1357" y="1094" text-anchor="middle" class="label" font-size="15">Independent assessment</text>
  <text x="1357" y="1119" text-anchor="middle" class="small">against published requirements</text>

  <rect x="890" y="1165" width="285" height="80" class="assurance"/>
  <text x="1032" y="1199" text-anchor="middle" class="label">Policy profiles</text>
  <text x="1032" y="1224" text-anchor="middle" class="small">local rules above a common floor</text>

  <rect x="1215" y="1165" width="285" height="80" class="assurance"/>
  <text x="1357" y="1199" text-anchor="middle" class="label">Collective representation</text>
  <text x="1357" y="1224" text-anchor="middle" class="small">guilds · unions · data trusts</text>

  <rect x="1052" y="1260" width="285" height="42" class="assurance"/>
  <text x="1194" y="1287" text-anchor="middle" class="small">Decision-and-rationale registry</text>

  <path d="M740 1150 L860 1150" class="feedback"/>
  <path d="M860 1185 L740 1185" class="feedback"/>

  <!-- Decision core and outputs -->
  <path d="M405 1320 L405 1360 L800 1360 L800 1390" class="line"/>
  <path d="M1195 1320 L1195 1360 L800 1360 L800 1390" class="line"/>

  <rect x="500" y="1400" width="600" height="96" class="core"/>
  <text x="800" y="1440" text-anchor="middle" class="coretext">Per-governed-object disposition process</text>
  <text x="800" y="1460" text-anchor="middle" class="coretiny" font-size="13">Each claim, evidence item, or artifact receives its own disposition;</text>
  <text x="800" y="1480" text-anchor="middle" class="coretiny" font-size="13">one case may contain several dispositions</text>

  <path d="M800 1496 L800 1530 L225 1530 L225 1560" class="line"/>
  <path d="M800 1496 L800 1530 L610 1530 L610 1560" class="line"/>
  <path d="M800 1496 L800 1530 L995 1530 L995 1560" class="line"/>
  <path d="M800 1496 L800 1530 L1380 1530 L1380 1560" class="line"/>

  <rect x="70" y="1570" width="310" height="100" class="output"/>
  <text x="225" y="1608" text-anchor="middle" class="label" font-size="17">Retained in protected custody</text>
  <text x="225" y="1634" text-anchor="middle" class="small" font-size="14">protected source material remains in custody</text>

  <rect x="455" y="1570" width="310" height="100" class="output"/>
  <text x="610" y="1608" text-anchor="middle" class="label" font-size="17">Authorized for specified use</text>
  <text x="610" y="1634" text-anchor="middle" class="small">stated purpose, scope, and conditions</text>

  <rect x="840" y="1570" width="310" height="100" class="output"/>
  <text x="995" y="1608" text-anchor="middle" class="label">Worker-portable claim</text>
  <text x="995" y="1634" text-anchor="middle" class="small">provenance and status visible</text>

  <rect x="1225" y="1570" width="305" height="100" class="output"/>
  <text x="1377" y="1608" text-anchor="middle" class="label" font-size="17">Restricted or pending dispute</text>
  <text x="1377" y="1634" text-anchor="middle" class="small" font-size="14">authorization, evidence, or claim unresolved</text>

  <text x="800" y="1702" text-anchor="middle" class="tiny">Principles first · worker-centered · multi-stakeholder · vendor-neutral · evidence-seeking</text>
</svg>
